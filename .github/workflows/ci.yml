name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynacl pytest numpy
      - name: Run unit tests
        run: python -m pytest tests/ -q

  e2e:
    name: e2e (real UDP, 3-tier weaknet)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynacl pytest numpy
      - name: Run real-UDP e2e integration test
        run: python examples/udp_e2e_test.py
